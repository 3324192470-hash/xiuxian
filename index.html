<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>问道 · 修仙纪</title>
<meta name="theme-color" content="#0c0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0c0f13; --bg2:#12161c; --panel:#181d25; --panel2:#1f2631;
  --line:#2c3644; --line2:#3a4658;
  --gold:#d9b96a; --gold2:#f0d99a; --jade:#6ec8a4; --jade2:#9fe3c6;
  --blood:#c05a5a; --purple:#9b7fd4; --azure:#6aa8d9;
  --txt:#d6d0c4; --txt2:#9aa3b0; --txt3:#6b7482;
  --ok:#6ec8a4; --warn:#d9a35a; --bad:#c05a5a;
  /* 2D 美术素材（AI 生成，风格统一：深墨蓝底 + 金线）
     已按实际显示尺寸压缩为 WebP，体积从 21.5MB 降到 0.6MB */
  --art-bg: url("assets/bg-ambient.webp");
  --art-hero: url("assets/bg-hero.webp");
  --art-panel: url("assets/panel-tex.webp");
  --art-cloud: url("assets/cloud-band.webp");
  --art-corner: url("assets/corner.webp");
  /* 角色 / 灵宠 / 地图立绘 */
  --art-player: url("assets/player-cultivator.webp");
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #1a2330 0%, transparent 60%),
    radial-gradient(800px 500px at 90% 110%, #1a2620 0%, transparent 55%),
    var(--bg);
  color:var(--txt);
  font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;
  font-size:15px; line-height:1.7; overflow:hidden;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:3px 3px;
}

/* ============ 2D 美术层（整体 UI 美术风重做） ============ */
/* 全屏氛围背景：水墨仙山 + 明月，固定铺底，其上再叠深色保证文字可读 */
body{
  background:
    var(--art-bg) center top / cover no-repeat fixed,
    radial-gradient(1200px 600px at 50% -10%, #1a2330 0%, transparent 60%),
    radial-gradient(800px 500px at 90% 110%, #1a2620 0%, transparent 55%),
    linear-gradient(180deg,#0b0e12,#0c0f13);
}
/* 顶部与底部各加一层暗化蒙版，确保标题屏/底部标签文字清晰 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(180deg, rgba(8,10,14,.72) 0%, rgba(8,10,14,.30) 22%, rgba(8,10,14,.30) 72%, rgba(8,10,14,.82) 100%);
}
/* 顶栏：在其上叠一层水墨氛围图，文字加描边更易读 */
#topbar{
  position:relative;
}
#topbar::before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:0 0 6px 6px;
  background:var(--art-hero) center top / cover no-repeat;
  opacity:.16;mix-blend-mode:screen;
}
#topbar .tb-name{text-shadow:0 1px 3px #000,0 0 18px rgba(217,185,106,.45)}
#topbar .tb-org,#topbar .tb-time,#topbar .tb-attr{text-shadow:0 1px 2px #000}
/* 面板：暗墨纸纹理 + 金线云纹标题 */
.panel{
  background:
    var(--art-panel) center / cover no-repeat,
    linear-gradient(180deg,rgba(31,38,49,.86),rgba(24,29,37,.90));
  background-blend-mode:overlay;
  border:1px solid var(--line);
  box-shadow:0 2px 14px rgba(0,0,0,.45), inset 0 0 0 1px rgba(217,185,106,.05);
}
.panel-t{
  border-bottom:1px solid var(--line);
  text-shadow:0 1px 2px #000;
  position:relative;
}
.panel-t::after{
  content:"";display:block;height:6px;margin-top:7px;border-radius:2px;
  background:var(--art-cloud) center / 240px 6px no-repeat;
  opacity:.55;mix-blend-mode:screen;
}
/* 卡片：角饰 + 金边微光 */
.card{
  background:
    var(--art-panel) center / cover no-repeat,
    rgba(12,15,19,.62);
  background-blend-mode:soft-light;
  border:1px solid var(--line);
  box-shadow:inset 0 0 0 1px rgba(217,185,106,.04);
}
.card::before{
  content:"";position:absolute;top:-1px;left:-1px;width:26px;height:26px;pointer-events:none;
  background:var(--art-corner) 0 0 / 52px 52px no-repeat;
  opacity:.5;mix-blend-mode:screen;
}
.card{position:relative;overflow:hidden}
/* 底部标签条：水墨氛围 + 金线顶边 */
#tabs{
  position:relative;
  background:
    var(--art-hero) center bottom / 420px 120px no-repeat,
    rgba(12,15,19,.94);
  background-blend-mode:screen;
  border-top:1px solid var(--line2);
  box-shadow:0 -2px 16px rgba(0,0,0,.5);
}
.tab{text-shadow:0 1px 2px #000;color:var(--txt3)}
.tab.on{color:var(--gold2);border-top-color:var(--gold);text-shadow:0 0 8px rgba(217,185,106,.6)}
/* 按钮：金边微光 + 轻纹理 */
.btn{
  background:var(--art-panel) center / cover no-repeat, rgba(217,185,106,.07);
  background-blend-mode:soft-light;
  border:1px solid var(--line2);
  box-shadow:0 1px 6px rgba(0,0,0,.4), inset 0 0 0 1px rgba(217,185,106,.06);
  text-shadow:0 1px 2px #000;
}
.btn:active{transform:translateY(1px)}
/* 模态框：卷轴感背景 + 金角 */
.modal{
  position:relative;
  background:var(--art-panel) center / cover no-repeat, linear-gradient(180deg,#1e242e,#161a21);
  background-blend-mode:overlay;
  border:1px solid var(--line2);
  box-shadow:0 24px 70px rgba(0,0,0,.78);
}
.modal::before{
  content:"";position:absolute;top:-1px;left:-1px;width:40px;height:40px;pointer-events:none;
  background:var(--art-corner) 0 0 / 80px 80px no-repeat;
  opacity:.6;mix-blend-mode:screen;
}
.modal-h{text-shadow:0 1px 2px #000}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}

#app{position:relative;z-index:1;height:100%;height:100dvh;display:flex;flex-direction:column;max-width:1180px;margin:0 auto;padding:0 10px;padding-top:env(safe-area-inset-top);padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}

/* ============ 顶栏 ============ */
#topbar{padding:10px 4px 8px;border-bottom:1px solid var(--line);flex-shrink:0}
.tb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tb-name{font-size:19px;color:var(--gold2);letter-spacing:2px;text-shadow:0 0 18px rgba(217,185,106,.35)}
.tb-realm{font-size:13px;color:var(--jade2);border:1px solid var(--line2);padding:1px 9px;border-radius:3px;background:rgba(110,200,164,.07)}
.tb-org{font-size:12px;color:var(--txt2)}
.tb-spacer{flex:1}
.tb-time{font-size:12px;color:var(--txt3)}
.tb-new{margin-left:8px;padding:2px 9px;font-size:11px}
.tb-attr{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--txt2);margin-top:5px}
.tb-attr b{color:var(--txt);font-weight:400}
.dao-xin-bar{display:inline-block;width:70px;height:5px;background:#2a2028;border-radius:3px;overflow:hidden;vertical-align:middle;margin-left:4px}
.dao-xin-bar i{display:block;height:100%;background:linear-gradient(90deg,#c05a5a,#d9b96a,#6ec8a4);transition:width .4s}

.xiuwei-wrap{margin-top:8px}
.xiuwei-top{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2);margin-bottom:3px}
.xiuwei-top .num{color:var(--gold2);font-variant-numeric:tabular-nums}
.bar{height:9px;background:#0a0d11;border:1px solid var(--line);border-radius:2px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5a7fa8,#6ec8a4);transition:width .35s;box-shadow:0 0 12px rgba(110,200,164,.5)}
.bar.hp i{background:linear-gradient(90deg,#8a3a3a,#c05a5a);box-shadow:0 0 12px rgba(192,90,90,.4)}
.bar.mp i{background:linear-gradient(90deg,#3a5a8a,#6aa8d9);box-shadow:0 0 12px rgba(106,168,217,.4)}
.bar.xp i{background:linear-gradient(90deg,#8a7434,#d9b96a);box-shadow:0 0 12px rgba(217,185,106,.4)}

/* ============ 主体 ============ */
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 4px 16px;scroll-behavior:smooth;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.panel{background:linear-gradient(180deg,rgba(31,38,49,.85),rgba(24,29,37,.85));border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:10px}
.panel-t{font-size:14px;color:var(--gold);letter-spacing:1px;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel-t::before{content:"";width:3px;height:13px;background:var(--gold);border-radius:2px}
.panel-t .sub{font-size:11px;color:var(--txt3);letter-spacing:0;margin-left:auto}
.muted{color:var(--txt2);font-size:13px}
.tiny{font-size:12px;color:var(--txt3)}
.gold{color:var(--gold2)}.jade{color:var(--jade2)}.blood{color:var(--blood)}.pur{color:var(--purple)}.azure{color:var(--azure)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 14px;border:1px solid var(--line2);border-radius:3px;background:rgba(217,185,106,.06);color:var(--txt);font-size:13px;transition:.16s;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(217,185,106,.16);border-color:var(--gold);color:var(--gold2);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.pri{background:rgba(217,185,106,.14);border-color:var(--gold);color:var(--gold2)}
.btn.pri:hover:not(:disabled){background:rgba(217,185,106,.28);box-shadow:0 0 16px rgba(217,185,106,.25)}
.btn.danger{background:rgba(192,90,90,.1);border-color:#6a3838;color:#e09090}
.btn.danger:hover:not(:disabled){background:rgba(192,90,90,.22);border-color:var(--blood);color:#f0a8a8}
.btn.sm{padding:3px 10px;font-size:12px}
.btn.wide{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}

.card{background:rgba(12,15,19,.55);border:1px solid var(--line);border-radius:3px;padding:10px 12px;transition:.16s}
.card:hover{border-color:var(--line2)}
.card.sel{border-color:var(--gold);background:rgba(217,185,106,.08)}
.card-t{font-size:14px;color:var(--gold2);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.card-d{font-size:12px;color:var(--txt2);line-height:1.6;min-height:2.6em}
.card-a{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid var(--line2);border-radius:2px;color:var(--txt2);background:rgba(255,255,255,.03)}
.tag.g{border-color:#4a6a55;color:var(--jade2);background:rgba(110,200,164,.08)}
.tag.y{border-color:#6a5a2a;color:var(--gold2);background:rgba(217,185,106,.08)}
.tag.r{border-color:#6a3838;color:#e09090;background:rgba(192,90,90,.08)}
.tag.p{border-color:#4a3a6a;color:#c0a8e8;background:rgba(155,127,212,.08)}
.tag.b{border-color:#33506a;color:#9fc8e8;background:rgba(106,168,217,.08)}
.q0{color:#b8b8b8}.q1{color:#7fd4a0}.q2{color:#6aa8d9}.q3{color:#b98fd4}.q4{color:#e0a85a}.q5{color:#e07a7a}

.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;border-bottom:1px dashed rgba(58,70,88,.45)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--txt2)}
.kv .v{color:var(--txt);font-variant-numeric:tabular-nums;text-align:right}
.log{max-height:190px;overflow-y:auto;font-size:12.5px;line-height:1.85}
.log div{padding:2px 0;border-bottom:1px dashed rgba(58,70,88,.3);color:var(--txt2)}
.log div:last-child{border-bottom:none}
.log .t{color:var(--txt3);margin-right:6px;font-size:11px}

/* ============ 底部标签 ============ */
#tabs{display:flex;gap:2px;border-top:1px solid var(--line);background:rgba(12,15,19,.9);flex-shrink:0;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;min-width:64px;padding:9px 4px 8px;text-align:center;font-size:12px;color:var(--txt3);border-top:2px solid transparent;transition:.16s;white-space:nowrap}
.tab:hover{color:var(--txt);background:rgba(255,255,255,.03)}
.tab.on{color:var(--gold2);border-top-color:var(--gold);background:rgba(217,185,106,.07)}
.tab .ic{display:block;font-size:16px;line-height:1.3}
.tab .dot{position:absolute;margin-left:-6px;margin-top:-2px;width:6px;height:6px;background:var(--blood);border-radius:50%}

/* ============ 弹窗 ============ */
#modal-layer{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(4,6,9,.78);backdrop-filter:blur(3px)}
#modal-layer.on{display:flex}
.modal{width:100%;max-width:560px;max-height:86vh;overflow-y:auto;background:linear-gradient(180deg,#1e242e,#161a21);border:1px solid var(--line2);border-radius:5px;box-shadow:0 24px 70px rgba(0,0,0,.75);animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{padding:13px 16px;border-bottom:1px solid var(--line);font-size:16px;color:var(--gold2);letter-spacing:1px;display:flex;align-items:center;gap:8px}
.modal-b{padding:14px 16px;font-size:14px;line-height:1.85}
.modal-f{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal-b p{margin-bottom:9px}
.modal-b .hl{color:var(--gold2)}
.modal-b .quote{border-left:2px solid var(--line2);padding-left:10px;color:var(--txt2);font-style:italic;margin:8px 0}

#toast-layer{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:100%;max-width:520px;padding:0 12px}
.toast{background:rgba(24,29,37,.96);border:1px solid var(--line2);border-left:3px solid var(--gold);border-radius:3px;padding:7px 14px;font-size:13px;color:var(--txt);box-shadow:0 8px 26px rgba(0,0,0,.6);animation:slide .3s ease-out;max-width:100%}
.toast.g{border-left-color:var(--jade)}.toast.r{border-left-color:var(--blood)}.toast.p{border-left-color:var(--purple)}
@keyframes slide{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

/* ============ 战斗 ============ */
.battle-stage{text-align:center;padding:6px 0 10px}
.battle-vs{display:flex;align-items:center;justify-content:center;gap:14px;font-size:15px}
.fighter{flex:1;max-width:190px}
.fighter .av{font-size:34px;line-height:1.2}
.fighter .nm{font-size:13px;margin:2px 0 5px}
.fighter .bar{margin-bottom:3px}
.fighter .hpn{font-size:11px;color:var(--txt3);font-variant-numeric:tabular-nums}
.battle-log{height:150px;overflow-y:auto;background:rgba(8,10,13,.6);border:1px solid var(--line);border-radius:3px;padding:8px 10px;font-size:12.5px;line-height:1.8}
.battle-log div{margin-bottom:2px}
.battle-log .me{color:var(--jade2)}
.battle-log .foe{color:#e09090}
.battle-log .sys{color:var(--gold2)}
.battle-log .dim{color:var(--txt3)}
.dmg{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ============ 其他 ============ */
.hr{height:1px;background:var(--line);margin:11px 0}
.center{text-align:center}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line2);color:var(--txt2)}
.prog-mini{height:4px;background:#0a0d11;border-radius:2px;overflow:hidden;margin-top:5px}
.prog-mini i{display:block;height:100%;background:var(--gold);transition:width .3s}
.scroll-x{overflow-x:auto;white-space:nowrap;padding-bottom:4px}
.scroll-x .chip{display:inline-block;margin-right:6px}
.chip{padding:4px 11px;border:1px solid var(--line2);border-radius:14px;font-size:12.5px;color:var(--txt2);transition:.16s}
.chip:hover{border-color:var(--gold);color:var(--gold2)}
.chip.on{background:rgba(217,185,106,.15);border-color:var(--gold);color:var(--gold2)}
.empty{text-align:center;color:var(--txt3);font-size:13px;padding:22px 0}
@media(max-width:600px){
  body{font-size:14px}
  .tb-name{font-size:17px}
  .tb-attr{gap:9px;font-size:11.5px}
  #main{padding:10px 2px 14px}
  .panel{padding:10px 11px}
  .modal{max-height:90vh}
}
@media(max-width:768px){
  /* 手机/小平板：放大可点击区域，避免误触 */
  .btn{padding:9px 14px;font-size:14px}
  .btn.sm{padding:7px 11px;font-size:13px}
  .tab{padding:11px 4px 9px;font-size:12px}
  .tab .ic{font-size:18px}
  .tb-row{gap:7px}
  .tb-new{margin-left:6px}
}
@media(max-width:600px){
  /* 窄屏：底部标签栏可横向滚动，单行不挤压 */
  #tabs{overflow-x:auto;justify-content:flex-start}
  .tab{min-width:62px;flex:0 0 auto}
  .tb-attr{font-size:11px;gap:7px}
  /* 名称输入框放大到 ≥16px，避免 iOS 聚焦时自动放大 */
  #nameInput,#importArea,.nameInput{font-size:16px !important}
  .xiuwei-top{font-size:11px}
  .kv{font-size:12.5px}
  .grid.g2,.grid.g3{grid-template-columns:1fr}
  .panel-t{font-size:13.5px}
}
/* 输入框允许文本选择（其余区域仍禁选，避免长按误选） */
input,textarea{-webkit-user-select:text;user-select:text}
input,textarea,select{font-size:16px}

/* ============ 2D 美术：角色立绘 / 灵宠立绘 / 地图 / 战斗演出 ============ */
/* 道侣 / 灵宠卡片：左侧 2D 立绘 */
.portrait{
  width:84px;height:84px;flex:0 0 auto;border-radius:6px;overflow:hidden;
  border:1px solid var(--line2);box-shadow:0 4px 14px rgba(0,0,0,.5);
  background:linear-gradient(160deg,#10151c,#0b0e12) center/cover no-repeat;
}
.portrait.full{width:100%;height:200px;border-radius:4px}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
/* 立绘为 3:4 半身像，横幅容器裁切时优先保住头部 */
.portrait.full img{object-position:center 14%}
/* 灵宠立绘为方形，横幅容器居中即可 */
.pet-row .portrait.full img{object-position:center 42%}
.lover-row,.pet-row{display:flex;gap:10px;align-items:flex-start}
.lover-row .body,.pet-row .body{flex:1;min-width:0}
/* 灵宠缩略立绘 */
.pet-badge{
  width:54px;height:54px;border-radius:8px;overflow:hidden;flex:0 0 auto;
  border:1px solid var(--line2);background:#0b0e12 center/cover no-repeat;
}
.pet-badge img{width:100%;height:100%;object-fit:cover;display:block}

/* 历练：2D 可探索地图（节点式大地图） */
.map-wrap{position:relative;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#0a0d11}
.map-canvas{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
.map-node{
  position:relative;flex:1 1 30%;min-width:120px;border:1px solid var(--line2);border-radius:5px;

   ============================================================ */

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];

const fmt = n => {
  n = Math.floor(n);
  if (n < 10000) return "" + n;
  if (n < 1e8) return (n / 1e4).toFixed(n < 1e6 ? 2 : 1) + "万";
  if (n < 1e12) return (n / 1e8).toFixed(2) + "亿";
  return (n / 1e12).toFixed(2) + "兆";
};
const pct = n => (n * 100).toFixed(1) + "%";
const nowSec = () => Math.floor(Date.now() / 1000);
function hhmmss(s) {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h > 0 ? h + "时" : "") + m + "分" + x + "秒";
}
/* 道历：统一按 365 日/年、12 月/年、30 日/月（年末 5 日为「岁余」）
   全项目一致，不再使用 360 日/年的旧口径。 */
function gameDate(t) {
  const days = Math.max(0, Math.floor(t));
  const Y = Math.floor(days / GAME_DAYS_PER_YEAR);
  const rem = days % GAME_DAYS_PER_YEAR;
  const M = Math.floor(rem / GAME_DAYS_PER_MONTH);
  const D = rem % GAME_DAYS_PER_MONTH;
  if (M >= 12) return `道历 ${Y} 年 岁余${D + 1}日`;
  return `道历 ${Y} 年 ${M + 1} 月 ${D + 1} 日`;
}
/* 凡人阶段：显示「第 N 日」 */
function mortalDate(t) {
  return `第 ${Math.max(1, Math.floor(t) + 1)} 日`;
}
/* 游戏日 → 年份（用于成就与统计） */
function gameYears(t) { return Math.floor(Math.max(0, t) / GAME_DAYS_PER_YEAR); }

/* ============================================================
   一、数据表
   ============================================================ */

/* --- 境界 ---
   本原型范围：凡人 → 化神圆满（炼虚及以上不开放）。
   每境界的小境界数由 levels 决定；炼气为 1~10 重，其余为 初期/中期/后期/圆满。
   baseDurationSec = 该境界全部等级的目标总耗时（无任何加成，现实秒）。 */
const SUB = ["初期", "中期", "后期", "圆满"];
const CN_NUM = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
const CHONG = CN_NUM.map(c => c + "重");

const REALMS = [
  { id: "qi",       name: "炼气", icon: "🌱", levels: 10, baseDurationSec: 900,     life: 100,  atk: 14,    def: 5,     hp: 100,  subNames: CHONG },
  { id: "zhuji",    name: "筑基", icon: "🏔️", levels: 4,  baseDurationSec: 187918,  life: 180,  atk: 18,    def: 9,     hp: 200 },
  { id: "jindan",   name: "金丹", icon: "🔆", levels: 4,  baseDurationSec: 451002,  life: 320,  atk: 55,    def: 28,    hp: 700 },
  { id: "yuanying", name: "元婴", icon: "👶", levels: 4,  baseDurationSec: 1082406, life: 560,  atk: 170,   def: 85,    hp: 2400 },
  { id: "huashen",  name: "化神", icon: "🌊", levels: 4,  baseDurationSec: 2597774, life: 950,  atk: 520,   def: 260,   hp: 8000 }
];
/* 本版本无仙界，全部境界皆属人界；化神圆满即阶段终点 */
const HUMAN_REALMS = REALMS.length;

/* ---- 索引换算：全局 realmIdx 是「大境界×N + 小境界」的扁平编号 ---- */
const REALM_SUBS = REALMS.map(r => r.levels);
const REALM_START = (() => { let acc = 0; return REALMS.map((r, i) => { const s = acc; acc += REALM_SUBS[i]; return s; }); })();
const MAX_INDEX = REALM_START[REALMS.length - 1] + REALM_SUBS[REALMS.length - 1] - 1;
function realmMajor(idx) {
  idx = clamp(Math.floor(idx), 0, MAX_INDEX);
  for (let i = REALMS.length - 1; i >= 0; i--) if (idx >= REALM_START[i]) return i;
  return 0;
}
function realmSub(idx) { return clamp(Math.floor(idx), 0, MAX_INDEX) - REALM_START[realmMajor(idx)]; }
function realmSubs(m) { return REALM_SUBS[clamp(m, 0, REALMS.length - 1)]; }
/* 大境界 m 的首个 / 末个全局索引；也用于把「第几大境界」门槛换算成索引 */
function majorStart(m) { return REALM_START[clamp(m, 0, REALMS.length - 1)]; }
function majorEnd(m) { return REALM_START[clamp(m, 0, REALMS.length - 1)] + realmSubs(m) - 1; }
function realmSubName(m, sub) {
  const r = REALMS[m];
  if (r.subNames) return r.subNames[clamp(sub, 0, r.subNames.length - 1)];
  return SUB[clamp(sub, 0, 3)];
}
function realmInfo(idx) {
  const m = realmMajor(idx), sub = realmSub(idx), r = REALMS[m];
  return { r, m, s: sub, n: realmSubs(m), name: r.name + realmSubName(m, sub), icon: r.icon, index: idx };
}

/* ============================================================
   修为曲线（单一数据源）
   ------------------------------------------------------------
   设计约束（见设计文档 §1.4）：
   1) baseDurationSec 表示无加成时该境界全部等级的目标总耗时；
   2) needXiuwei() 只算「当前等级所需修为」；
   3) getCultivationRate() 只算「每秒修为增长」；
   4) realSecPerLevel() = needXiuwei / baseCultivationRate，不得另维护一份耗时表；
   5) BREAK_BONUS 是设计目标，不得靠改某个境界的基础需求来掩盖公式错误。
   ============================================================ */
const BASE_RATIO = 6;      /* 大境界基础需求倍率 */
const SPEED_GROWTH = 0.72; /* 本境界内速度增长 */
const BREAK_BONUS = 2.2;   /* 大境界突破后速度跳升 */

/* 预计算：每境界每等级的「基准需求」与「基准耗时」。
   本境界内第 k 级权重 w(k) = R^k / (1 + SPEED_GROWTH·k/n)，
   其中 R = BASE_RATIO^(1/n)。需求涨得快、速度涨得慢 → 耗时逐级递增。 */
const CURVE = (() => {
  const rows = [];
  let prevEndRate = 0;
  REALMS.forEach((r, m) => {
    const n = r.levels;
    const R = Math.pow(BASE_RATIO, 1 / n);
    const w = [];
    let S = 0;
    for (let k = 0; k < n; k++) { w[k] = Math.pow(R, k) / (1 + SPEED_GROWTH * k / n); S += w[k]; }
    const targetSec = k => r.baseDurationSec * w[k] / S;
    /* 首级需求：炼气锚定 100；其余由「上境末速 × BREAK_BONUS」反推 */
    const need0 = (m === 0) ? 100 : prevEndRate * BREAK_BONUS * targetSec(0);
    const needs = k => need0 * Math.pow(R, k);
    const endRate = needs(n - 1) / targetSec(n - 1);
    rows.push({ m, n, R, w, S, need0, targetSec, needs, endRate });
    prevEndRate = endRate;
  });
  return rows;
})();

/* 当前等级所需修为 */
function needXiuwei(idx) {
  const m = realmMajor(idx), sub = realmSub(idx);
  return Math.floor(CURVE[m].needs(sub));
}
/* 基准修炼速度（修为 / 现实秒，无任何加成） */
function baseCultivationRate(idx) {
  const m = realmMajor(idx), sub = realmSub(idx);
  return CURVE[m].needs(sub) / CURVE[m].targetSec(sub);
}
/* 该等级耗时 = 需求 / 基准速度（派生量，不单独维护） */
function realSecPerLevel(idx) {
  return needXiuwei(idx) / baseCultivationRate(idx);
}
/* 该大境界的目标总耗时（校验用） */
function realmTargetSec(m) { return REALMS[clamp(m, 0, REALMS.length - 1)].baseDurationSec; }
function realmLife(idx) {
  const m = realmMajor(idx), n = realmSubs(m);
  return Math.floor(REALMS[m].life * (1 + (realmSub(idx) / n)));
}

/* 怪物强度：
   1) 大境界 = min(区域难度, 玩家大境界)，新手不会误撞高境界怪；
   2) 小境界跟随玩家当前小境界（±1），保证"打得动但有点压力"。
      若全范围随机，炼气一重会撞上炼气九重的怪，直接打不过。 */
function makeMonster(zoneTier, name, icon, playerIdx) {
  const pIdx = playerIdx === undefined ? 0 : playerIdx;
  const pm = realmMajor(pIdx), psub = realmSub(pIdx);
  const monMajor = clamp(Math.min(clamp(zoneTier, 0, 13), pm), 0, REALMS.length - 1);
  const r = REALMS[monMajor];
  const n = realmSubs(monMajor);
  const monSub = clamp(psub + ri(-1, 1), 0, n - 1);
  const subMul = 1 + (monSub / n) * 0.72;
  /* 玩家高于该区域时怪物进一步弱化，让"回头刷低区"更轻松 */
  const over = pm - monMajor;
  const scale = over <= 0 ? 1.0 : Math.pow(0.62, over);
  return {
    name, icon, tier: zoneTier, sub: monSub,
    hpMax: Math.max(1, Math.floor(r.hp * subMul * scale)), hp: 0,
    atk: Math.max(1, Math.floor(r.atk * subMul * 0.8 * scale)),
    def: Math.max(0, Math.floor(r.def * subMul * 0.75 * scale)),
    crit: 0.05, dodge: 0.03
  };
}
/* 首领战可行性估算：用于自动模式避免反复送死（失败会掉境界，代价很重） */
function estimateWinChance(s, foe) {
  const st = calcStats(s);
  const myDps = Math.max(1, st.atk * (1 - foe.def / (foe.def + st.atk * 2.6)));
  const roundsToKill = foe.hpMax / myDps;
  const foeDps = Math.max(1, foe.atk * (1 - st.def / (st.def + foe.atk * 2.6)));
  const myRounds = st.hpMax / foeDps;
  if (roundsToKill < myRounds) return 1;                 /* 能在被打死前杀掉 */
  return clamp(myRounds / roundsToKill, 0, 1);
}

const BREAK_BASE = [0.80, 0.70, 0.62, 0.55, 0.48];
function breakChance(s, luckOverride) {
  const idx = s.realmIdx;
  if (idx >= MAX_INDEX) return 0;
  const m = realmMajor(idx), sub = realmSub(idx), n = realmSubs(m);
  const luck = luckOverride !== undefined ? luckOverride : s.luck;
  let c = BREAK_BASE[m];
  /* 小境界越高越难：按「本境界内进度比例」扣减，与重数无关。
     炼气 10 重的跨度与筑基 4 重一致，不会因为重数多就更难。 */
  c -= (sub / n) * 0.34;
  c += s.bonus.breakRate                  /* 出身/剧情/宗门 */
    + s.daoXin / 800                      /* 道心：满值 +12.5% */
    + luck / 2500;                        /* 气运：100 点 +4% */
  return clamp(c, 0.05, 0.95);
}
/* ============================================================
   二、核心引擎
   ============================================================ */
/* ============================================================
   时间系统（统一规则）
   ------------------------------------------------------------
   区分三种时间：
   1) 现实时间：电脑实际经过的秒数 —— 用于离线收益、现实日重置、任务计时
   2) 游戏时间：用于道历、剧情年份（单位：游戏日，s.time）
   3) 修炼进度：用于修为增长、杂役任务、自动战斗进度

   规则：
   - 游戏时间与修炼进度共用同一个有效时间倍率，不允许只加速其中一个；
   - 离线收益先按真实秒数封顶 24 小时，再应用倍率；
   - 现实日重置（丹药次数）不受倍率影响；
   - 暂停时修炼、任务、日历均暂停；
   - 存档只存时间戳与进度，不靠每秒写档推进时间。
   ============================================================ */
const REAL_SEC_PER_GAME_DAY = 900;                       /* 1 游戏日 = 15 现实分钟 */
const GAME_DAYS_PER_REAL_SEC = 1 / REAL_SEC_PER_GAME_DAY;

const BASE_TOTAL_REAL_SEC = 50 * 24 * 60 * 60;           /* 50 个现实日（基础培养目标） */
const OFFLINE_CAP_SEC = 24 * 60 * 60;                    /* 单次离线最多结算 24 小时 */
const DEV_TIME_MULTIPLIERS = [1, 20, 100, 500, 2000];    /* 开发加速档（仅原型测试） */
const DEFAULT_TIME_MULTIPLIER = 1;

const GAME_DAYS_PER_YEAR = 365;                          /* 游戏内年份统一按 365 日 */
const GAME_DAYS_PER_MONTH = 30;                          /* 道历：每月 30 日 */
const BASE_GAME_DAYS = BASE_TOTAL_REAL_SEC / REAL_SEC_PER_GAME_DAY;   /* 4800 游戏日 */
const BASE_GAME_YEARS = BASE_GAME_DAYS / GAME_DAYS_PER_YEAR;          /* 约 13.15 游戏年 */

/* 当前有效时间倍率（游戏时间与修炼进度共用） */
function getTimeMultiplier(s) {
  return (s && s.speed) || DEFAULT_TIME_MULTIPLIER;
}
/* 离线专用：把真实离线秒数转成「有效秒数」——先封顶 24h，再乘倍率。
   注意：此函数含 OFFLINE_CAP_SEC 封顶，严禁用于在线推进。 */
function getOfflineEffectiveSec(realElapsedSec, multiplier = 1) {
  const capped = Math.max(0, Math.min(realElapsedSec, OFFLINE_CAP_SEC));
  return capped * multiplier;
}
/* 在线专用：把真实经过秒数转成「有效秒数」——不封顶，仅乘倍率。
   在线推进（advanceGameTime）必须用此函数，不得调用 getOfflineEffectiveSec。 */
function getOnlineEffectiveSec(realElapsedSec, multiplier = 1) {
  return Math.max(0, realElapsedSec) * multiplier;
}
/* 有效秒数 → 游戏日 */
function getGameDaysElapsed(effectiveElapsedSec) {
  return effectiveElapsedSec / REAL_SEC_PER_GAME_DAY;
}
/* 由「现实秒 × 倍率」直接换算游戏日（在线推进用；在线不封顶） */
function realSecToGameDays(realSec, multiplier = 1) {
  return (realSec * multiplier) / REAL_SEC_PER_GAME_DAY;
}
/* 游戏日 → 现实秒（用于展示「还需多久」） */
function gameDaysToRealSec(gameDays, multiplier = 1) {
  return (gameDays * REAL_SEC_PER_GAME_DAY) / Math.max(1e-9, multiplier);
}

/* ---------- 属性聚合 ----------
   百分比加成（功法/出身/宗门/灵宠/洞府）与固定值加成（法宝）必须分开：
   法宝的 atk/def/hp 是绝对值，功法的才是百分比。混用会让一件布甲把气血放大几十倍。 */
function agg(s) {

  const flat = { atk: 0, def: 0, hp: 0 };
  const addPct = o => { if (!o) return; for (const k in o) if (k in pct) pct[k] += o[k]; };
  const addFlat = o => { if (!o) return; flat.atk += o.atk || 0; flat.def += o.def || 0; flat.hp += o.hp || 0; };
  addPct(s.bonus);
  s.arts.forEach(id => { const art = ARTS.find(x => x.id === id); if (art) addPct(art.effects); });
  /* 注意：宗门加成已由 applySect 并入 s.bonus，上面 addPct(s.bonus) 已计入，切勿重复。 */
  /* 法宝：攻/防/血为固定值，暴击/闪避/吸血为百分比 */
  SLOTS.forEach(sl => {
    const e = s.equip[sl.id];
    if (!e) return;
    addFlat(e.stats);
    addPct({ crit: e.stats.crit || 0, dodge: e.stats.dodge || 0, lifesteal: e.stats.lifesteal || 0 });
  });
  if (s.pet) {
    const p = PETS.find(x => x.id === s.pet);
    if (p) {
      addPct(p.stat);
      const lv = s.petLv - 1;
      for (const k in p.grow) {
        if (k === "atk" || k === "def" || k === "hp") pct[k] = (pct[k] || 0) + p.grow[k] * lv;
        else if (k === "luck") { /* 气运为绝对值，单独处理 */ }
        else pct[k] = (pct[k] || 0) + p.grow[k] * lv;
      }
    }
  }

  pct.alchemy += s.cave.dantian * 0.03;
  pct.money += s.cave.waimen * 0.04;
  /* 灵宠提供的气运（绝对值） */

      if (p.grow.luck) luckFlat += p.grow.luck * (s.petLv - 1);

function calcStats(s) {

  const sub2 = 1 + subMul * 0.72;               /* 满重时约 +72%，与原「四小境 +54%」同量级 */
  const atk = Math.floor((R.atk * sub2 + flat.atk) * (1 + a.atk));
  const def = Math.floor((R.def * sub2 + flat.def) * (1 + a.def));
  const hpMax = Math.floor((R.hp * sub2 + flat.hp) * (1 + a.hp + s.perm.hp));
  const mpMax = Math.floor(60 + s.realmIdx * 22 * (1 + a.mp));
  const rootMul = (ROOTS.find(r => r.id === s.root) || ROOTS[0]).mul;
  const luck = s.luck + luckFlat;
  const baseRate = baseCultivationRate(s.realmIdx);
  /* ---------- 修炼速度（统一口径，见 DESIGN-mortal.md §1.6；具体计算见 getCultivationRate） ----------
     所有加成【加法累计】，最后统一乘算：
       rate = base * (1 + artRate + caveRate + talentRate + otherRate)
     灵根是独立的体质乘区（不属于"加成"，而是根骨差异）。
     同一加成只能进入结算一次——功法/灵宠/天赋/丹药不得重复应用。 */
  const r = getCultivationRate(s, baseRate, rootMul, luck);
  const rate = r.rate;
  return {
    atk, def, hpMax, mpMax, rate, a, luck, luckFlat,
    addRate: r.addRate, artRate: r.artRate, caveRate: r.caveRate, rootBonus: r.rootBonus,
    crit: clamp(0.05 + a.crit, 0, 0.85),
    dodge: clamp(0.03 + a.dodge, 0, 0.6),
    lifesteal: clamp(a.lifesteal, 0, 0.5),
    breakRate: clamp(breakChance(s, luck), 0.05, 0.99),
    shopCost: clamp(1 + a.shopCost, 0.4, 2),
    alchemy: a.alchemy, money: a.money, expGain: a.expGain
  };
}

/* ---------- 修炼速度（统一口径，见 DESIGN-mortal.md §1.6） ----------
   四来源【加法累计】，最后统一乘算（灵气+根骨+洞府+功法）：
     rate = baseRate * (1 + artRate + caveRate + rootBonus + talentRate + otherRate) * (1 + (luck-10)/1000)
   其中：
     - artRate    : 已启用功法的 effects.cultivationRate 之和（含炼体，与 §1.4.5 合计 +58% 一致）
     - caveRate   : 聚灵阵 +3% / 级
     - rootBonus  : 灵根由「乘区」改为「封顶加法」—— Math.min(rootMul - 1, 1.0)，
                    即五行(+0)/双(+0.6)/天(+1.0封顶)/雷冰剑/混沌(+1.0封顶)。
                    避免 4.2 倍乘区碾压其他加成（设计 §1.6.1）。
     - talentRate : 天赋（预留）
     - otherRate  : 出身 / 剧情 / 永久丹药等（s.bonus.rate + s.perm.rate）
   注意：开发倍率 devTimeMul 不在此处——由 cultivateTick / UI 在 rate 之外乘（保持"修为/现实秒"口径）。 */
function getCultivationRate(s, baseRate, rootMul, luck) {
  const artRate = s.arts.reduce((acc, id) => {
    const a = ARTS.find(x => x.id === id);
    return acc + ((a && a.effects && a.effects.cultivationRate) || 0);
  }, 0);
  const caveRate = s.cave.lingzhen * 0.03;          /* 聚灵阵 +3%/级 */
  const rootBonus = Math.min(rootMul - 1, 1.0);     /* 灵根封顶加法 */
  const talentRate = 0;                              /* 天赋（预留） */
  const otherRate = s.bonus.rate + s.perm.rate;      /* 出身/剧情/永久丹药等 */
  const addRate = artRate + caveRate + rootBonus + talentRate + otherRate;
  const rate = baseRate * (1 + addRate) * (1 + (luck - 10) / 1000);   /* 修为 / 现实秒 */
  return { rate, addRate, artRate, caveRate, rootBonus };
}

/* ---------- 音效（Web Audio 合成，无素材） ---------- */
let AC = null;
function sfx(kind) {
  if (!G || !G.settings.sfx || G._silent) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime;
    const mk = (f, f2, dur, type, vol) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol || 0.14, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
    };
    if (kind === "click") mk(520, 700, 0.07, "triangle", 0.07);
    else if (kind === "hit") mk(180, 70, 0.13, "square", 0.09);
    else if (kind === "crit") { mk(300, 90, 0.2, "sawtooth", 0.12); mk(900, 300, 0.16, "triangle", 0.07); }
    else if (kind === "win") { mk(523, 0, 0.14, "sine", 0.1); setTimeout(() => mk(784, 0, 0.2, "sine", 0.1), 110); }
    else if (kind === "lose") { mk(300, 120, 0.35, "sine", 0.11); }
    else if (kind === "break") { mk(220, 880, 0.5, "sine", 0.13); setTimeout(() => mk(660, 1320, 0.6, "triangle", 0.1), 180); }
    else if (kind === "fail") { mk(400, 90, 0.5, "sawtooth", 0.11); }
    else if (kind === "coin") { mk(1200, 1800, 0.08, "triangle", 0.07); }
    else if (kind === "levelup") { mk(600, 1200, 0.3, "sine", 0.11); }
  } catch (e) { }
}

/* ---------- 背包 / 丹药 ---------- */
function addBag(s, item) { s.bag.push(item); }

  return true;
}
function genEquip(tier, realmIdx) {
  const slot = pick(SLOTS).id;
  const ni = clamp(realmMajor(realmIdx) + ri(-1, 1), 0, 8);
  const base = EQUIP_BASE[slot][ni];
  const bias = tier * 5;
  const roll = Math.random() * 100;
  let si = 0;
  if (roll < 1.5 + bias * 0.25) si = 5;
  else if (roll < 7 + bias * 0.55) si = 4;
  else if (roll < 19 + bias * 0.9) si = 3;
  else if (roll < 41 + bias * 1.1) si = 2;
  else if (roll < 70) si = 1;
  const sfx = EQUIP_SUFFIX[si];
  const power = base.a * sfx.m;
  const stats = {};
  if (slot === "weapon") stats.atk = Math.floor(power);
  else if (slot === "armor") { stats.def = Math.floor(power * 0.8); stats.hp = Math.floor(power * 4); }
  else if (slot === "boots") { stats.def = Math.floor(power * 0.45); stats.dodge = +Math.min(0.06, power / 4000).toFixed(4); }
  else { stats.atk = Math.floor(power * 0.55); stats.hp = Math.floor(power * 2.6); }
  const exPool = ["atk", "def", "hp", "crit", "dodge", "lifesteal"];
  const nEx = ri(1, 2);
  for (let i = 0; i < nEx; i++) {
    const k = pick(exPool);
    if (k === "crit") stats.crit = +((stats.crit || 0) + Math.min(0.06, power / 6000 + 0.005)).toFixed(4);
    else if (k === "dodge") stats.dodge = +((stats.dodge || 0) + Math.min(0.05, power / 8000 + 0.004)).toFixed(4);
    else if (k === "lifesteal") stats.lifesteal = +((stats.lifesteal || 0) + Math.min(0.04, power / 12000 + 0.003)).toFixed(4);
    else if (k === "hp") stats.hp = (stats.hp || 0) + Math.floor(power * 1.8);
    else if (k === "def") stats.def = (stats.def || 0) + Math.floor(power * 0.3);
    else stats.atk = (stats.atk || 0) + Math.floor(power * 0.35);
  }
  const qname = base.n + sfx.s;
  return {
    uid: "e" + Math.random().toString(36).slice(2, 9),
    slot, name: base.n, qname, tier: sfx.t, stats,
    price: Math.floor(base.a * sfx.m * 3 + 20),
    ilv: ni
  };
}
function equipScore(e) {
  if (!e) return 0;
  const st = e.stats;
  return (st.atk || 0) * 2 + (st.def || 0) * 1.5 + (st.hp || 0) * 0.12 + (st.crit || 0) * 3000 + (st.dodge || 0) * 2500 + (st.lifesteal || 0) * 2500;
}
function equipItem(s, uid) {
  const i = s.bag.findIndex(e => e.uid === uid);
  if (i < 0) return;
  const it = s.bag[i];
  const old = s.equip[it.slot];
  s.equip[it.slot] = it;
  s.bag.splice(i, 1);
  if (old) s.bag.push(old);
  addLog(s, `装备了 ${it.qname}。`, "g");
  sfx("click");
  const st = calcStats(s);
  s.hp = Math.min(s.hp, st.hpMax);
}
function unequip(s, slot) {
  const e = s.equip[slot];
  if (!e) return;

}

/* ---------- 战斗 ---------- */
function monsterForZone(s, zone, isBoss) {

  const m = pool.length ? pick(pool) : MONSTERS[0];
  /* 传入区域 tier（地图难度），由 makeMonster 内部换算成大境界 */

  if (isBoss) {
    mm.name = zone.boss.n; mm.icon = zone.boss.i; mm.isBoss = true;
    mm.hpMax = Math.floor(mm.hpMax * 3.2); mm.atk = Math.floor(mm.atk * 1.5);
    mm.def = Math.floor(mm.def * 1.4);

  mm.hp = mm.hpMax;

}
function startBattle(s, foe, kind) {

  s.reviveUsed = false;
  s.stat.battles++;
  const pet = s.pet ? PETS.find(p => p.id === s.pet) : null;
  if (pet && pet.id === "jiu") foe.atk = Math.floor(foe.atk * 0.8);
  addBattleLog(s, `⚔️ 遭遇 ${foe.name}！`, "sys");
}
function addBattleLog(s, txt, cls) {

function dmgCalc(atk, def) {

}
function battleRound(s) {
  const b = s.battle; if (!b || b.over) return;
  const st = calcStats(s);
  const foe = b.foe;
  b.round++;
  const pet = s.pet ? PETS.find(p => p.id === s.pet) : null;

  /* 玩家出手 */
  let mult = 1, label = "";
  const hasSkill = s.arts.some(id => { const a = ARTS.find(x => x.id === id); return a && a.type === "skill"; });
  if (hasSkill && b.round % 3 === 0) { mult = 1.9; label = "【战技】"; }
  let miss = Math.random() < foe.dodge;
  if (miss) addBattleLog(s, `你${label}出手，被 ${foe.name} 闪避。`, "dim");
  else {
    let d = dmgCalc(st.atk * mult, foe.def);
    const isCrit = Math.random() < st.crit;
    if (isCrit) d = Math.floor(d * 1.8);
    foe.hp -= d;
    if (isCrit) sfx("crit"); else sfx("hit");
    addBattleLog(s, `${label}你击中 ${foe.name}，造成 <b>${fmt(d)}</b> 伤害${isCrit ? "（暴击！）" : ""}。`, "me");
    if (st.lifesteal > 0) {
      const heal = Math.floor(d * st.lifesteal);
      if (heal > 0) { s.hp = Math.min(st.hpMax, s.hp + heal); addBattleLog(s, `你吸取了 ${fmt(heal)} 气血。`, "dim"); }
    }
  }
  /* 灵宠 */
  if (pet) {
    if (pet.id === "huo" && b.round % 5 === 0) { const d = dmgCalc(st.atk * 2, foe.def); foe.hp -= d; addBattleLog(s, `🦊 火灵狐喷出烈焰，造成 ${fmt(d)} 伤害。`, "me"); }
    if (pet.id === "lei" && b.round % 4 === 0) { const d = dmgCalc(st.atk * 1.5, foe.def); foe.hp -= d; addBattleLog(s, `🦅 雷鹏俯冲而下，造成 ${fmt(d)} 伤害。`, "me"); }
    if (pet.id === "long" && b.round % 3 === 0) { const d = dmgCalc(st.atk * 3, foe.def); foe.hp -= d; const h = Math.floor(st.hpMax * 0.1); s.hp = Math.min(st.hpMax, s.hp + h); addBattleLog(s, `🐉 螭龙怒吼，造成 ${fmt(d)} 伤害，并回复 ${fmt(h)} 气血。`, "me"); }
  }
  if (foe.hp <= 0) return endBattle(s, true);

  /* 敌人出手 */
  miss = Math.random() < st.dodge;
  if (miss) addBattleLog(s, `${foe.name} 攻来，你侧身避过。`, "dim");
  else {
    let d = dmgCalc(foe.atk, st.def);
    if (pet && pet.id === "xuan") d = Math.floor(d * 0.85);
    const isCrit = Math.random() < foe.crit;
    if (isCrit) d = Math.floor(d * 1.7);
    s.hp -= d;
    addBattleLog(s, `${foe.name} 击中你，受到 <b>${fmt(d)}</b> 伤害${isCrit ? "（暴击！）" : ""}。`, "foe");
  }

      s.hp = st.hpMax;
      addBattleLog(s, "⚪ 九转还魂丹光华大作，你自死境中归来！", "sys");
      sfx("win");
    } else return endBattle(s, false);
  }
  if (b.round >= foe.maxRound) {

function endBattle(s, win, stalemate) {

    let money = Math.floor((20 + foe.tier * 45 + foe.tier * foe.tier * 12) * zone.drop * (1 + st.money) * rnd(0.8, 1.3));
    if (foe.isBoss) money *= 4;
    money = Math.floor(money * (1 + st.expGain));
    s.money += money; s.stat.totalMoney += money; s.stat.battleMoney += money;
    const xw = Math.floor(needXiuwei(s.realmIdx) * (0.06 + foe.tier * 0.012) * (1 + st.expGain));
    s.xiuwei += xw;
    let txt = `获得 ${fmt(money)} 灵石、${fmt(xw)} 修为`;
    const lootRoll = Math.random();
    if (lootRoll < (foe.isBoss ? 0.85 : 0.14)) {
      const it = genEquip(foe.tier, s.realmIdx);
      addBag(s, it);
      txt += `、<span class="q${it.tier}">${it.qname}</span>`;
    }
    if (Math.random() < 0.25) { s.herbs += ri(1, 2 + Math.floor(foe.tier / 2)); txt += "、灵草"; }
    if (Math.random() < 0.08) { const p = pick(PILLS.slice(0, 4)); addPill(s, p.id, 1); txt += "、" + p.name; }
    addBattleLog(s, "🎁 " + txt + "。", "sys");
    if (foe.isBoss) { s.bossKilled[zone.id] = true; s.zoneProgress = 0; }
    else s.zoneProgress++;
    s.stat.zoneFights++;   /* 历练场次（含首领击败），供御风术/玄冰诀等功法前置计数 */
    checkArtGrants(s);     /* 历练/首领击杀满足御风术、玄冰诀、破军拳、诛天剑意等前置 */
    /* 自动整理战利品 */

  } else {
    s.stat.losses++; s.stat.deaths++;
    if (!s._silent) sfx("lose");
    addBattleLog(s, "💀 你力竭倒下……", "foe");

    if (Math.random() < 0.45 && s.realmIdx > 0) {
      s.realmIdx--;
      dropTxt += `，境界跌落至 <span class="blood">${realmInfo(s.realmIdx).name}</span>`;
      s.xiuwei = 0;
    }
    if (s.bag.length > 0 && Math.random() < 0.5) {

    }
    s.daoXin = Math.max(0, s.daoXin - 3);
    addBattleLog(s, "💔 " + dropTxt + "。", "foe");

/* ---------- 全自动战斗辅助 ---------- */
function autoEquipBest(s) {

  SLOTS.forEach(sl => {
    let best = s.equip[sl.id], bi = -1;
    s.bag.forEach((it, i) => {
      if (it.slot !== sl.id) return;
      if (equipScore(it) > equipScore(best)) { best = it; bi = i; }

    if (bi >= 0) {

function nowReal() { return Date.now() / 1000; }
/* 自动战斗主调度：由主循环驱动 */
function autoBattleTick(s, dt) {
  const a = s.auto;
  if (!a.on) return;
  const st = calcStats(s);
  /* 无战斗：疗伤或开下一场 */
  if (!s.battle) {
    /* 气血不足则打坐疗伤（疗伤期间正常修炼） */
    if (s.hp < st.hpMax * a.restHp) return;
    s._advCd = (s._advCd || 0) + dt;
    if (s._advCd < 0.35) return;
    s._advCd = 0;
    /* 自动前往最佳区域：以「不超过自身大境界」为准，而非仅看解锁门槛。
       ZONES.req 只是最低解锁条件，按 tier 匹配当前境界才打得动，否则收益反降。 */
    if (a.autoZone) {
      const myMajor = realmMajor(s.realmIdx);
      let best = null;
      for (const z of ZONES) {
        if (s.realmIdx < majorStart(z.req)) continue;
        if (z.tier > myMajor) continue;              /* 不越级送死 */
        if (!best || z.tier > best.tier) best = z;
      }
      if (!best) best = ZONES[0];
      if (best.id !== s.zone) {
        s.zone = best.id; s.zoneProgress = 0; s._bossCd = 0;
        addLog(s, `🤖 自动前往 ${best.icon} ${best.name} 历练。`, "sys");
      }
    }
    const zone = ZONES.find(z => z.id === s.zone) || ZONES[0];
    /* 首领：仅当预估能打赢时才挑战。
       首领血量 3.2 倍、攻击 1.5 倍，失败会掉境界且代价很重，
       所以在战力不足时必须退回刷普通怪，否则会陷入"反复送死"。 */
    let wantBoss = false;
    if (a.boss && (!s.bossKilled[zone.id] || s._bossCd === undefined || s._bossCd <= 0)) {
      const probe = monsterForZone(s, zone, true);
      const wr = estimateWinChance(s, probe);
      if (wr >= 0.85) wantBoss = true;
      else if (!s._bossWarned) {
        s._bossWarned = true;
        addBattleLog(s, "🤖 战力尚不足以稳胜本地首领，先刷普通妖兽。", "sys");
      }
    }
    doAdventure(s, wantBoss ? "boss" : "field");
    if (wantBoss) s._bossCd = 8; else s._bossCd = Math.max(0, (s._bossCd || 0) - 1);
    return;
  }
  const b = s.battle;
  /* 战斗已结束：倒计时结束后清理，下一轮开新战 */
  if (b.over) {
    b.doneIn = (b.doneIn || 0) - dt;
    if (b.doneIn <= 0) s.battle = null;
    return;
  }
  /* 回合推进 */
  b.cd += dt;
  const interval = 1 / Math.max(0.5, a.speed);
  while (b.cd >= interval && s.battle && !s.battle.over) {
    b.cd -= interval;
    if (!autoBattleManage(s)) battleRound(s);
  }
}
/* ============================================================
   三、修炼 / 突破 / 飞升
   ============================================================ */
/* 数值兜底：任何异常写入（NaN/Inf/负数）都在此处被纠正，保护存档 */
function sanitize(s) {
  const st = calcStats(s);
  const num = (v, d) => (typeof v === "number" && isFinite(v) ? v : d);
  s.xiuwei = Math.max(0, num(s.xiuwei, 0));
  s.money = Math.max(0, Math.floor(num(s.money, 0)));
  s.herbs = Math.max(0, Math.floor(num(s.herbs, 0)));
  s.contrib = Math.max(0, Math.floor(num(s.contrib, 0)));
  s.luck = Math.max(0, num(s.luck, 10));
  s.reputation = Math.max(0, num(s.reputation, 0));
  s.daoXin = clamp(num(s.daoXin, 50), 0, 100);
  s.hp = clamp(num(s.hp, st.hpMax), 1, st.hpMax);
  s.mp = clamp(num(s.mp, st.mpMax), 0, st.mpMax);
  s.time = Math.max(0, num(s.time, 0));
  s.realmIdx = clamp(Math.floor(num(s.realmIdx, 0)), 0, MAX_INDEX);
  /* 2D 可探索场景：主角归一化坐标 + 场内妖兽（旧档缺字段时补默认） */
  if (!s.scene || typeof s.scene !== "object") s.scene = { x: 0.5, y: 0.76 };
  s.scene.x = clamp(num(s.scene.x, 0.5), 0.06, 0.94);
  s.scene.y = clamp(num(s.scene.y, 0.76), 0.10, 0.94);
  if (!Array.isArray(s.sceneFoes)) s.sceneFoes = [];
  return s;
}
/* 修炼推进。
   入参 realElapsedSec = 真实经过秒数（已含时间倍率由调用方决定）。
   统一在这里推进：修为、游戏日历、buff 计时、自然恢复。
   速度单位为「修为 / 现实秒」，因此修为增量 = rate × 真实秒 × 倍率。 */
function cultivateTick(s, realElapsedSec, timeMul) {
  const st = calcStats(s);
  const mul = (timeMul === undefined) ? getTimeMultiplier(s) : timeMul;
  const effSec = realElapsedSec * mul;              /* 有效修炼秒数 */
  const gain = st.rate * effSec;
  s.xiuwei += gain;
  s.stat.totalCultivate += gain;
  s.time += realSecToGameDays(realElapsedSec, mul); /* 日历与修炼共用同一倍率 */
  /* buff 到期（按有效秒计时） */
  s.buffs = s.buffs.filter(b => { b.left -= effSec; return b.left > 0; });
  /* 自然恢复：每现实秒回复 8% 气血 / 12% 真气。
     自动战斗开启时，疗伤同样按战斗倍率加速，否则高倍率会被回血卡住。 */
  const healMul = (s.auto && s.auto.on) ? Math.max(1, s.auto.speed) : 1;
  s.hp = Math.min(st.hpMax, s.hp + st.hpMax * 0.08 * effSec * healMul);
  s.mp = Math.min(st.mpMax, s.mp + st.mpMax * 0.12 * effSec * healMul);
  sanitize(s);
}
function tryBreak(s, isAuto) {
  const idx = s.realmIdx;
  if (idx >= MAX_INDEX) { if (!isAuto) toast("已至化神圆满，此界前路已尽。", ""); return; }
  const need = needXiuwei(idx);
  if (s.xiuwei < need) { if (!isAuto) toast("修为不足，尚需 " + fmt(need - s.xiuwei) + " 修为。", "r"); return; }
  let ch = breakChance(s);
  let usedPill = null, noDrop = false;
  if (s.pendingPill && (s.pills[s.pendingPill] || 0) > 0) {
    const p = PILLS.find(x => x.id === s.pendingPill);
    if (p && p.breakAdd) { ch += p.breakAdd; usedPill = p; noDrop = !!p.noDrop; usePill(s, p.id, 1); }
  }
  ch = clamp(ch, 0.05, 0.99);
  s.xiuwei -= need;
  if (Math.random() < ch) {
    s.realmIdx++;
    s.stat.breakOk++;
    s._failStreak = 0;
    const st = calcStats(s);
    s.hp = st.hpMax; s.mp = st.mpMax;
    addLog(s, `🎉 突破成功！境界提升至 ${realmInfo(s.realmIdx).name}。`, "g");
    sfx("break");
    toast(`突破成功！${realmInfo(s.realmIdx).name}`, "g");
    checkStory(s);
    checkAchievements(s);
    /* 抵达化神圆满 → 阶段结局 */
    if (isStageEnd(s) && !s.stageEndShown) {
      setTimeout(() => showStageEnd(s), 700);
    }
  } else {
    s.stat.breakFail++;
    const back = Math.floor(need * 0.25);
    s.xiuwei = Math.max(0, s.xiuwei - back);
    let txt = `突破失败，修为倒退 ${fmt(back)}`;
    /* 跌落境界：概率随连败次数递增，但保底不清空修为，避免"修炼越快罚得越狠"的倒挂 */
    s._failStreak = (s._failStreak || 0) + 1;
    const dropChance = Math.min(0.45, 0.10 + s._failStreak * 0.08);
    if (!noDrop && s.realmIdx > 0 && Math.random() < dropChance) {
      s.realmIdx--;
      s.xiuwei = Math.floor(needXiuwei(s.realmIdx) * 0.5);
      s._failStreak = 0;
      txt += `，境界跌落至 <span class="blood">${realmInfo(s.realmIdx).name}</span>`;
    } else {
      /* 未跌落时，保留部分已投入修为，下次更容易成功 */
      s.xiuwei += Math.floor(need * 0.15);
    }
    const stNow = calcStats(s);
    const d = Math.floor(stNow.hpMax * 0.25);
    s.hp = Math.max(1, s.hp - d);
    s.daoXin = Math.max(0, s.daoXin - 2);
    addLog(s, "💢 " + txt + "，气血受损。", "r");
    sfx("fail");
    toast("突破失败……" + (s.realmIdx < idx ? "境界跌落！" : ""), "r");
  }
  if (usedPill) s.pendingPill = null;
  render();
}
/* 阶段终点 */
/* 抵达阶段终点（化神圆满）：显示阶段结局 + 未竟之事 + 后续钩子。
   注意：这不是死亡，也不是存档结束；存档仍可读取与继续挂机。 */
function showStageEnd(s) {
  if (s.stageEndShown) {
    /* 已看过则只做简短提示，避免每次进页面都弹 */
    toast("已至化神圆满，此界前路已尽。", "");
    return;
  }
  s.stageEndShown = true;
  const paras = STAGE_END.text.map(t => `<p>${t}</p>`).join("");
  const undone = STAGE_END.summary(s).map(t => `<li>${t}</li>`).join("");
  const hooks = STAGE_END.hooks.map(t => `<p class="tiny">· ${t}</p>`).join("");
  addLog(s, "🌊 化神圆满，本阶段告一段落。", "g");
  sfx("break");
  showModal(`${STAGE_END.icon} ${STAGE_END.title}`, `
    ${paras}
    <div class="hr"></div>
    <p class="gold">【${STAGE_END.summaryTitle}】</p>
    <ul style="margin:6px 0 10px 18px;line-height:1.9">${undone}</ul>
    <div class="hr"></div>
    <p class="gold">【此界未了】</p>
    ${hooks}
    <div class="hr"></div>
    <p class="tiny">本版本止于化神。存档已保留，炼虚及以上将于后续版本开放。</p>
  `, [
    { t: "继续修行（挂机）", pri: true, fn: () => { closeModal(); render(); } },
    { t: "查看成就", fn: () => { closeModal(); G.tab = "achieve"; render(); } }
  ]);
  checkAchievements(s);
}

/* ============================================================
   四、历练 / 事件 / 剧情
   ============================================================ */
function doAdventure(s, mode) {
  if (s.battle) return;
  const zone = ZONES.find(z => z.id === s.zone) || ZONES[0];
  const isBoss = mode === "boss";
  if (isBoss && s.bossKilled[zone.id] && !zone.repeatBoss) { /* 仍可重复挑战 */ }
  const foe = monsterForZone(s, zone, isBoss);
  startBattle(s, foe, isBoss ? "boss" : "field");
  sfx("click");
  render();
}
function rollEvent(s) {
  const pool = EVENTS.filter(e => e.minRealm <= s.realmIdx);
  const tot = pool.reduce((a, b) => a + b.w, 0);
  let r = Math.random() * tot;
  for (const e of pool) { r -= e.w; if (r <= 0) return e; }
  return pool[0];
}
/* 事件执行器：临时挂载派生字段（hpMax/mpMax/rate），事件可直接读取，
   执行后清理并校正气血/真气，避免 NaN 污染存档 */
function withDerived(s, fn) {
  const st = calcStats(s);
  s.hpMax = st.hpMax; s.mpMax = st.mpMax; s.rate = st.rate;
  try {
    return fn(s);
  } finally {
    delete s.hpMax; delete s.mpMax; delete s.rate;
    const st2 = calcStats(s);
    s.hp = clamp(isFinite(s.hp) ? s.hp : st2.hpMax, 1, st2.hpMax);
    s.mp = clamp(isFinite(s.mp) ? s.mp : st2.mpMax, 0, st2.mpMax);
    s.money = Math.max(0, isFinite(s.money) ? Math.floor(s.money) : 0);
    s.herbs = Math.max(0, isFinite(s.herbs) ? Math.floor(s.herbs) : 0);
    s.daoXin = clamp(isFinite(s.daoXin) ? s.daoXin : 50, 0, 100);
  }
}
function openEventModal(s, ev) {
  s.stat.events++;
  const btns = ev.opts.map(o => ({
    t: o.t, fn: () => {
      const res = withDerived(s, o.fn);
      closeModal();
      addLog(s, `【${ev.title}】${res.msg.replace(/<[^>]+>/g, "")}`, res.cls);
      toast(res.msg.replace(/<[^>]+>/g, "").slice(0, 40) + (res.msg.length > 40 ? "…" : ""), res.cls);
      checkAchievements(s);
      save();
      render();
    }
  }));
  showModal(`${ev.icon} ${ev.title}`, `<p>${ev.text}</p>`, btns);
}
/* 主线检查 */
function checkStory(s) {
  if (s.storyQueue.length) return;   /* 一次只推进一段剧情 */
  const all = STORY;
  for (const st of all) {
    if (s.storyDone.includes(st.id)) continue;
    if (st.cond(s)) {
      s.storyDone.push(st.id);
      if (st.reward) st.reward(s);
      s.storyQueue.push(st.id);
      break;
    }
  }
}
function showStoryModal(s, st) {
  const paras = st.text.map(t => `<p>${t}</p>`).join("");
  showModal(`${st.icon} ${st.title}`, paras + (st.rewardTxt ? `<div class="hr"></div><p class="gold">【获得】${st.rewardTxt}</p>` : ""),
    [{ t: "继续", pri: true, fn: () => { closeModal(); s.storyQueue.shift(); save(); render(); } }]);
}
/* 成就 */
function checkAchievements(s) {
  ACHIEVEMENTS.forEach(a => {
    if (!s.achievements.includes(a.id) && a.cond(s)) {
      s.achievements.push(a.id);
      toast(`🏆 成就达成：${a.n}`, "y");
      sfx("levelup");
    }
  });
  checkArtGrants(s);   /* 成就达成/功法增多后刷新万法归宗、九转玄功等前置 */
}

/* 拜入/转入宗门：写入 s.sect 并将宗门加成并入个人 bonus（rate/breakRate 为加法键，
   并入后可被 getCultivationRate 与 breakChance 同时读到），并直接授予宗门本命功法。
   剧情转宗（如 c6 太虚）与玩家手动拜师均走此函数，避免遗漏宗门加成。 */
function applySect(s, id) {
  const sec = SECTS.find(x => x.id === id);
  if (!sec) return;
  s.sect = id; s.sectRank = 0; s.contrib = 0;
  if (sec.bonus) Object.assign(s.bonus, sec.bonus);   /* rate/breakRate/atk/def… 均加法键 */
  if (sec.art && !s.arts.includes(sec.art)) s.arts.push(sec.art);
}

/* 统一授予功法（去重），并在授予后补发依赖型成就/奇遇钩子 */
function grantArt(s, id) {
  if (s.arts.includes(id)) return;
  s.arts.push(id);
  const a = ARTS.find(x => x.id === id);
  const name = a ? a.name : id;
  addLog(s, `习得功法《${name}》。`, "g");
  toast(`习得《${name}》！`, "g");
}

/* 条件型功法统一发放：由各系统（战斗/洞府/炼丹/道侣/灵宠/成就/奇遇）在满足条件后调用，
   仅校验该功法自身 condition，避免依赖隐式时序导致“看得见学不了”的死锁。
   注意：剧情/宗门发放的功法（yinqi/jinfeng/taixu_dao/danxia·jindan/tianmo·xuemo）不在此列，
   由对应剧情与 applySect 直接授予。 */
function checkArtGrants(s) {
  ARTS.forEach(a => {
    if (s.arts.includes(a.id)) return;
    if (!a.condition) return;
    const c = a.condition;
    let ok = true;
    if (c.caveLingzhen != null && (s.cave.lingzhen || 0) < c.caveLingzhen) ok = false;
    if (c.caveDantian != null && (s.cave.dantian || 0) < c.caveDantian) ok = false;
    if (c.loverFav != null && !Object.values(s.lovers || {}).some(l => (l.fav || 0) >= c.loverFav)) ok = false;
    if (c.zoneFights != null && (s.stat.zoneFights || 0) < c.zoneFights) ok = false;
    if (c.alchemyOk != null && (s.stat.alchemyOk || 0) < c.alchemyOk) ok = false;
    if (c.daoXinLt != null && !(s.daoXin < c.daoXinLt)) ok = false;
    if (c.pet != null && s.pet !== c.pet) ok = false;
    if (c.boss != null && !(s.bossKilled && s.bossKilled[c.boss])) ok = false;
    if (c.achievements != null && s.achievements.length < c.achievements) ok = false;
    if (c.ownedArts != null && s.arts.length < c.ownedArts) ok = false;
    if (ok) grantArt(s, a.id);
  });
}

/* ============================================================
   五、存档 / 离线
   ============================================================ */
function save() {
  if (!G) return;
  try {
    G.lastTick = nowSec();
    localStorage.setItem(SAVE_KEY, JSON.stringify(G));
  } catch (e) { }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    /* 补全新增字段 */
    const base = newState(s.origin || "fei");
    const merged = Object.assign({}, base, s);
    merged.bonus = Object.assign({}, base.bonus, s.bonus || {});
    merged.perm = Object.assign({}, base.perm, s.perm || {});
    merged.stat = Object.assign({}, base.stat, s.stat || {});
    merged.cave = Object.assign({}, base.cave, s.cave || {});
    merged.settings = Object.assign({}, base.settings, s.settings || {});
    merged.auto = Object.assign({}, base.auto, s.auto || {});
    merged.equip = Object.assign({}, base.equip, s.equip || {});
    merged.tokens = s.tokens || {};
    return sanitize(merged);
  } catch (e) { return null; }
}
function offlineSettle(s) {
  const now = nowSec();
  const elapsed = now - (s.lastTick || now);
  if (elapsed < 60) return null;
  /* 离线收益：先按真实秒数封顶 24 小时，再应用有效时间倍率 */
  const mul = getTimeMultiplier(s);
  const capped = Math.min(elapsed, OFFLINE_CAP_SEC);
  const effSec = getOfflineEffectiveSec(elapsed, mul);
  const gameDays = getGameDaysElapsed(effSec);
  const before = s.realmIdx;
  /* 离线修炼（100% 效率） */
  const st = calcStats(s);
  const gain = st.rate * effSec;
  s.xiuwei += gain;
  s.time += gameDays;
  s.stat.totalCultivate += gain;
  /* 离线不自动突破（自动突破已在开局取消，需玩家手动冲击境界） */
  let breaks = 0;
  /* 离线自动历练：按"每场战斗约 6 秒"折算场次，仅统计胜场收益 */
  let fight = { battles: 0, wins: 0, money: 0, items: 0 };
  if (s.auto.on) {
    s._silent = true;
    const zone = ZONES.find(z => z.id === s.zone) || ZONES[0];
    const maxBattles = Math.floor(capped / 6);
    const stNow = calcStats(s);
    /* 用玩家当前战力与区域内怪物强度估算胜率 */
    const zoneTier = clamp(zone.tier, 0, REALMS.length - 1);
    const mon = REALMS[zoneTier];
    const monAtk = mon.atk * 0.85, monHp = mon.hp, monDef = mon.def * 0.8;
    const myDps = Math.max(1, stNow.atk * (1 - monDef / (monDef + stNow.atk * 1.8)));
    const roundsToKill = Math.max(1, Math.ceil(monHp / myDps));
    const foeDps = Math.max(1, monAtk * (1 - stNow.def / (stNow.def + monAtk * 1.8)));
    const myRounds = Math.max(1, Math.ceil(stNow.hpMax / foeDps));
    const winRate = clamp(roundsToKill < myRounds ? 0.92 : 0.92 * (myRounds / roundsToKill), 0.05, 0.95);
    const capped2 = Math.min(maxBattles, 4000);   /* 单次结算上限，防极端数值 */
    let money = 0, items = 0, wins = 0;
    for (let i = 0; i < capped2; i++) {
      if (Math.random() < winRate) {
        wins++;
        const t = clamp(zone.tier + ri(-1, 1), 0, 13);
        money += Math.floor((20 + t * 45 + t * t * 12) * zone.drop * (1 + stNow.money) * (1 + stNow.expGain));
        if (Math.random() < 0.14) items++;
      }
    }
    s.money += money; s.stat.totalMoney += money; s.stat.battleMoney += money;
    s.stat.battles += capped2; s.stat.wins += wins; s.stat.losses += (capped2 - wins);
    s.stat.kills += wins;
    s.stat.autoSold += items;                 /* 离线拾取的装备视作已自动变卖 */
    fight = { battles: capped2, wins, money, items };
    s._silent = false;
  }
  const st2 = calcStats(s);
  s.hp = st2.hpMax; s.mp = st2.mpMax;
  s.lastTick = now;
  return { elapsed, capped, gain, breaks, before, after: s.realmIdx, fight };
}
/* ============================================================
   六、UI 渲染
   ============================================================ */
let G = null;

function render() {
  if (!G) return;
  const m = $("#main");
  const keepTop = m.scrollTop;
  const activeId = document.activeElement && document.activeElement.id;
  const selStart = activeId ? document.activeElement.selectionStart : null;
  renderTop();
  renderTabs();
  const fn = {
    cultivate: viewCultivate, adventure: viewAdventure, bag: viewBag, arts: viewArts,
    alchemy: viewAlchemy, cave: viewCave, sect: viewSect, lovers: viewLovers,
    story: viewStory, achieve: viewAchieve, shop: viewShop, settings: viewSettings
  }[G.tab] || viewCultivate;
  m.innerHTML = fn();
  m.scrollTop = keepTop;
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) { } }
  }
}

function renderTabs() {

    return `<button class="tab ${G.tab === t.id ? "on" : ""}" data-tab="${t.id}"><span class="ic">${t.i}</span>${t.n}${dot}</button>`;
  }).join("");

  const mul = 1 + buffs.reduce((a, b) => a + b.v, 0);

      </div>
      <div class="card">
        <div class="card-t">突破</div>
        <div class="card-d">
          ${isStageEnd(s) ? "<span class='gold'>已至化神圆满，此界前路已尽。存档保留，静待天门再开。</span>" :
        `突破成功率 <b class="${chance > 0.7 ? "jade" : chance > 0.45 ? "gold" : "blood"}">${pct(chance)}</b><br>

        <div class="card-a">
          ${isStageEnd(s)
      ? `<button class="btn" data-act="stageEnd">🌊 回看阶段结局</button>`

/* ---------- 2D 探索场景：障碍、怪物、移动与碰撞 ---------- */
function getSceneObstacles(zoneId) {
  const OBSTACLE_THEMES = {
    qingshi: [{ icon: "🌳", name: "老槐树" }, { icon: "🧱", name: "青石矮墙" }, { icon: "🏘️", name: "旧民舍" }],

    lin: [{ icon: "🌲", name: "迷雾古木" }, { icon: "🍄", name: "毒蕈群" }, { icon: "🌿", name: "荆棘林" }],
    zhao: [{ icon: "💧", name: "深寒毒潭" }, { icon: "🪵", name: "枯木桩" }, { icon: "🌫️", name: "迷障沼泽" }],
    huang: [{ icon: "⚔️", name: "残破古戟" }, { icon: "💀", name: "荒兽巨骸" }, { icon: "🏜️", name: "沙脊" }],
    yan: [{ icon: "🔥", name: "地心熔岩" }, { icon: "🌋", name: "火灵赤石" }, { icon: "🪨", name: "炽炎石笋" }],
    bing: [{ icon: "🧊", name: "万载玄冰" }, { icon: "❄️", name: "雪崩残痕" }, { icon: "🏔️", name: "冰封峭壁" }],
    jiu: [{ icon: "🏮", name: "冥灵引魂幡" }, { icon: "☠️", name: "白骨祭坛" }, { icon: "🪦", name: "古修古冢" }],
    mo: [{ icon: "😈", name: "天魔蚀柱" }, { icon: "🖤", name: "魔煞石" }, { icon: "🕳️", name: "深渊裂隙" }],
    jie: [{ icon: "⚡", name: "引雷金柱" }, { icon: "🌩️", name: "劫雷焦石" }, { icon: "🔮", name: "化劫残阵" }]
  };
  const theme = OBSTACLE_THEMES[zoneId] || OBSTACLE_THEMES.qingshi;
  return [
    { id: "obs1", x: 0.28, y: 0.45, w: 0.16, h: 0.14, icon: theme[0].icon, name: theme[0].name },
    { id: "obs2", x: 0.72, y: 0.45, w: 0.16, h: 0.14, icon: theme[1].icon, name: theme[1].name },
    { id: "obs3", x: 0.50, y: 0.20, w: 0.18, h: 0.12, icon: theme[2].icon, name: theme[2].name }
  ];
}
function sceneCanMoveTo(x, y, zoneId) {
  if (x < 0.08 || x > 0.92 || y < 0.12 || y > 0.90) return false;
  const obs = getSceneObstacles(zoneId || (G && G.zone) || "qingshi");
  for (const o of obs) {
    if (Math.abs(x - o.x) < (o.w / 2 + 0.045) && Math.abs(y - o.y) < (o.h / 2 + 0.045)) {
      return false;
    }
  }
  return true;
}
function initSceneFoes(s, zone) {
  if (s._sceneZone === zone.id && Array.isArray(s.sceneFoes) && s.sceneFoes.length) {
    return s.sceneFoes;
  }
  s._sceneZone = zone.id;
  const killed = !!s.bossKilled[zone.id];
  s.sceneFoes = [
    { id: "boss", name: zone.boss.n, icon: zone.boss.i, x: 0.50, y: 0.38, isBoss: true, dead: killed },
    { id: "mob1", name: "游荡妖兽", icon: zone.icon, x: 0.25, y: 0.24, isBoss: false, dead: false },
    { id: "mob2", name: "潜伏妖兽", icon: "🐾", x: 0.75, y: 0.24, isBoss: false, dead: false }
  ];
  return s.sceneFoes;
}
function checkSceneEncounter(s) {
  if (s.battle || !Array.isArray(s.sceneFoes)) return;
  for (const f of s.sceneFoes) {
    if (f.dead) continue;
    const dist = Math.hypot(s.scene.x - f.x, s.scene.y - f.y);
    if (dist < 0.065) {
      toast(`⚔️ 遭遇 ${f.name}！`, "y");
      doAdventure(s, f.isBoss ? "boss" : "field");
      break;
    }
  }
}
function updateSceneHeroDOM(s) {
  try {
    const el = document.querySelector ? document.querySelector(".scene-hero") : null;
    if (el && el.style) {
      el.style.left = (s.scene.x * 100).toFixed(1) + "%";
      el.style.top = (s.scene.y * 100).toFixed(1) + "%";
    }
  } catch (e) { }
}
function moveScene(s, dir) {
  if (!s || !s.scene) return;
  const STEP = 0.04;
  let dx = 0, dy = 0;
  if (dir === "up") dy = -STEP;
  else if (dir === "down") dy = STEP;
  else if (dir === "left") dx = -STEP;
  else if (dir === "right") dx = STEP;
  if (!dx && !dy) return;

  const curX = s.scene.x, curY = s.scene.y;
  const targetX = clamp(curX + dx, 0.06, 0.94);
  const targetY = clamp(curY + dy, 0.10, 0.94);

  if (sceneCanMoveTo(targetX, targetY, s.zone)) {
    s.scene.x = targetX;
    s.scene.y = targetY;
  } else if (dx !== 0 && sceneCanMoveTo(targetX, curY, s.zone)) {
    s.scene.x = targetX;
  } else if (dy !== 0 && sceneCanMoveTo(curX, targetY, s.zone)) {
    s.scene.y = targetY;
  } else {
    return;
  }

  checkSceneEncounter(s);
  updateSceneHeroDOM(s);
}
function sceneHTML(s, zone) {
  const img = (ART && ART.map && ART.map[zone.id]) ? "assets/" + ART.map[zone.id] : "";
  const obs = getSceneObstacles(zone.id);
  const foes = initSceneFoes(s, zone);

  const obsHTML = obs.map(o => `
    <div class="scene-obs" style="left:${(o.x * 100).toFixed(1)}%;top:${(o.y * 100).toFixed(1)}%;width:${(o.w * 100).toFixed(1)}%;height:${(o.h * 100).toFixed(1)}%">
      <span>${o.icon}</span>
      <span class="on">${o.name}</span>
    </div>
  `).join("");

  const foesHTML = foes.map(f => {
    if (f.dead) return "";
    const isBoss = !!f.isBoss;
    return `<div class="scene-foe ${isBoss ? "boss" : ""}" style="left:${(f.x * 100).toFixed(1)}%;top:${(f.y * 100).toFixed(1)}%" data-act="adventure" data-mode="${isBoss ? "boss" : "field"}" title="点击与 ${f.name} 交手">
      ${f.icon}

  }).join("");

  const heroX = (s.scene.x * 100).toFixed(1);
  const heroY = (s.scene.y * 100).toFixed(1);
  const realmName = REALMS[clamp(zone.tier, 0, REALMS.length - 1)].name;

  return `
  <div class="scene-wrap">
    <div class="scene"${img ? ` style="background-image:url('${img}')"` : ""}>
      <div class="scene-veil"></div>
      <div class="scene-tag">${zone.icon} ${zone.name} · ${realmName}境</div>
      ${obsHTML}
      ${foesHTML}
      <div class="scene-hero" style="left:${heroX}%;top:${heroY}%">
        <img src="assets/player-cultivator.webp" onerror="this.style.display='none'">
      </div>
      <div class="scene-pad">
        <button class="pd up" data-act="sceneMove" data-dir="up">▲</button>
        <button class="pd left" data-act="sceneMove" data-dir="left">◀</button>
        <button class="pd right" data-act="sceneMove" data-dir="right">▶</button>
        <button class="pd down" data-act="sceneMove" data-dir="down">▼</button>
      </div>
      <div class="scene-hint">WASD / 方向键移动</div>
    </div>
    <div class="zone-strip">
      ${ZONES.map(z => {
        const locked = s.realmIdx < majorStart(z.req);
        const isCur = s.zone === z.id;
        const killed = !!s.bossKilled[z.id];
        return `<button class="zone-chip ${isCur ? "on" : ""}${locked ? " locked" : ""}" data-act="setZone" data-id="${z.id}" ${locked ? "disabled" : ""} title="${locked ? "境界不足" : z.name}">
          ${z.icon} ${z.name}${killed ? " ✔" : ""}
        </button>`;
      }).join("")}
    </div>
  </div>`;
}

/* 功法获取消耗标签：{ contrib:N } 宗门贡献 / { spirit:N } 灵石 / 0 或空 = 条件/自动 */
function artCostTag(a, s) {
  if (!a.cost) return { ok: true, txt: "条件获取" };
  if (a.cost.contrib != null) return { ok: s.contrib >= a.cost.contrib, txt: `宗门贡献 ${fmt(a.cost.contrib)}` };
  if (a.cost.spirit != null) return { ok: s.money >= a.cost.spirit, txt: `灵石 ${fmt(a.cost.spirit)}` };
  return { ok: true, txt: "免费" };
}
/* 功法获取前置条件（非 sect/shop 渠道）；只展示，授予由对应系统校验 */
function artCondTag(a, s) {
  const c = a.condition; if (!c) return { ok: true, txt: "" };
  if (c.caveLingzhen != null) return { ok: s.cave.lingzhen >= c.caveLingzhen, txt: `聚灵阵 Lv${c.caveLingzhen}` };
  if (c.caveDantian != null) return { ok: (s.cave.dantian || 0) >= c.caveDantian, txt: `丹房 Lv${c.caveDantian}` };
  if (c.loverFav != null) return { ok: Object.values(s.lovers || {}).some(l => (l.fav || 0) >= c.loverFav), txt: `道侣好感≥${c.loverFav}` };
  if (c.zoneFights != null) return { ok: (s.stat.zoneFights || 0) >= c.zoneFights, txt: `历练${c.zoneFights}场` };
  if (c.alchemyOk != null) return { ok: (s.stat.alchemyOk || 0) >= c.alchemyOk, txt: `炼丹${c.alchemyOk}次` };
  if (c.daoXinLt != null) return { ok: s.daoXin < c.daoXinLt, txt: `道心<${c.daoXinLt}` };
  if (c.pet != null) return { ok: s.pet === c.pet, txt: `需灵宠` };
  if (c.boss != null) return { ok: !!(s.bossKilled && s.bossKilled[c.boss]), txt: `击败首领` };
  if (c.achievements != null) return { ok: s.achievements.length >= c.achievements, txt: `成就${c.achievements}项` };
  if (c.ownedArts != null) return { ok: s.arts.length >= c.ownedArts, txt: `习得${c.ownedArts}门` };
  return { ok: true, txt: "" };
}
function effTags(effects) {
  const N = { atk: "攻击", def: "防御", hp: "气血", mp: "真气", crit: "暴击", dodge: "闪避", lifesteal: "吸血", cultivationRate: "修炼速度", breakRate: "突破率", alchemy: "炼丹", money: "灵石收益", speed: "身法", expGain: "历练收益", luck: "气运", pillDaily: "每日丹药" };
  return Object.keys(effects).map(k => {
    const v = effects[k];
    const isP = k !== "speed" && k !== "pillDaily" && k !== "luck";   /* 这些按整数展示 */
    return `<span class="tag ${v > 0 ? "g" : "r"}">${N[k] || k} ${v > 0 ? "+" : ""}${isP ? (v * 100).toFixed(0) + "%" : v}</span>`;
  }).join(" ");
}

let modalBtns = [];
function showModal(title, body, btns) {
  modalBtns = btns || [];
  $("#modal-layer").innerHTML = `
    <div class="modal">
      <div class="modal-h">${title}</div>
      <div class="modal-b">${body}</div>
      <div class="modal-f">${modalBtns.map((b, i) => `<button class="btn ${b.pri ? "pri" : ""}" data-mb="${i}">${b.t}</button>`).join("")}</div>
    </div>`;
  $("#modal-layer").classList.add("on");
}
function closeModal() { $("#modal-layer").classList.remove("on"); $("#modal-layer").innerHTML = ""; modalBtns = []; }
$("#modal-layer").addEventListener("click", e => {
  if (e.target.id === "modal-layer") { closeModal(); return; }
  const b = e.target.closest("[data-mb]");
  if (b) { const f = modalBtns[+b.dataset.mb]; if (f && f.fn) f.fn(); }
});
/* 阶段结局面板（可重复查看） */
function openStageEndModal() {
  const s = G;
  s.stageEndShown = false;      /* 允许重看 */
  showStageEnd(s);
}
/* ============================================================
   八、交互
   ============================================================ */
document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { G.tab = tab.dataset.tab; sfx("click"); render(); return; }
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, s = G;
  sfx("click");
  switch (act) {
    case "tab": G.tab = el.dataset.tab; break;
    case "break": tryBreak(s, false); return;
    case "setPill": s.pendingPill = el.dataset.id || null; break;
    case "ascendModal": case "stageEnd": openStageEndModal(); return;
    case "setZone": {
      const z = ZONES.find(x => x.id === el.dataset.id);
      if (s.realmIdx < majorStart(z.req)) { toast("境界不足，此地凶险。", "r"); return; }
      s.zone = z.id; s.zoneProgress = 0;
      if (s.scene) { s.scene.x = 0.5; s.scene.y = 0.76; }
      initSceneFoes(s, z);
      break;
    }
    case "sceneMove": moveScene(s, el.dataset.dir); return;
    case "adventure": doAdventure(s, el.dataset.mode); return;
    case "toggleAuto": {
      s.auto.on = !s.auto.on;
      if (s.auto.on) { s.autoAdventure = false; toast("▶️ 全自动历练已开启", "g"); }
      else { toast("⏹ 已停止自动历练", ""); }
      break;
    }

/* ============================================================
   九、游戏循环
   ------------------------------------------------------------
   统一时间推进入口 advanceGameTime()。
   修炼、日历、战斗、杂役任务全部在这里按同一倍率推进，
   避免各处分别累计时间造成重复结算。
   ============================================================ */
/* 推进一帧。realElapsedSec = 真实经过秒数（未乘倍率） */
function advanceGameTime(s, realElapsedSec) {
  if (!s || s.paused) return;                      /* 暂停时全部停止 */
  const mul = getTimeMultiplier(s);
  const effSec = getOnlineEffectiveSec(realElapsedSec, mul); /* 有效秒数：日历与进度共用（在线不封顶） */
  const gameDays = getGameDaysElapsed(effSec);

  if (!s.battle) {
    /* 无战斗：正常修炼（cultivateTick 内部会推进日历与 buff） */
    cultivateTick(s, realElapsedSec, mul);
  } else {
    /* 战斗中：修为不增长，但日历照常推进（共用同一倍率） */
    s.time += gameDays;
    s.buffs = s.buffs.filter(b => { b.left -= effSec; return b.left > 0; });
  }
  /* 全自动历练（含战斗推进、自动服药、自动疗伤、自动整理）
     战斗节奏用有效秒数，使其与时间倍率一致 */
  autoBattleTick(s, effSec);
  /* 杂役任务计时（真实耗时型任务，按有效秒数推进） */
  choreTick(s, effSec);
  sanitize(s);
}

/* ---------- 杂役任务计时（预留：宗门杂役线实现后填充） ----------
   真实耗时型任务按「有效秒数」推进，与修炼共用同一时间倍率。 */
function choreTick(s, effSec) {
  if (!s.sectChore) return;
  const c = s.sectChore;
  if (!c.id) return;
  c.endsAt = (c.endsAt || 0) - effSec;
  if (c.endsAt > 0) return;
  /* 完成一次 */
  const def = (typeof SECT_CHORES !== "undefined") && SECT_CHORES.find(x => x.id === c.id);
  if (!def) { s.sectChore = null; return; }
  applyChoreReward(s, def);
  c.completed = (c.completed || 0) + 1;
  s.sectChoreCount = s.sectChoreCount || {};
  s.sectChoreCount[c.id] = (s.sectChoreCount[c.id] || 0) + 1;
  if (c.loop) c.endsAt += def.secs; else s.sectChore = null;
}
function applyChoreReward(s, def) {
  const r = def.reward || {};
  if (r.contrib) s.contrib += r.contrib;
  if (r.money) { s.money += r.money; s.stat.totalMoney += r.money; }
  if (r.herbs) s.herbs += r.herbs;
  if (r.xiuwei) s.xiuwei += needXiuwei(s.realmIdx) * r.xiuwei;
  if (def.flavor && def.flavor.length) addLog(s, pick(def.flavor), "");
}

let lastFrame = Date.now(), saveAcc = 0;
function loop() {
  const now = Date.now();
  const dt = Math.min((now - lastFrame) / 1000, 60);
  lastFrame = now;
  if (G) {
    advanceGameTime(G, dt);
    /* 随机事件（历练进度，自动模式下也照常弹出，让玩家有得选） */
    if (!G.battle && G.zoneProgress > 0 && G.zoneProgress % 10 === 0 && G._lastEventProg !== G.zoneProgress) {
      G._lastEventProg = G.zoneProgress;
      openEventModal(G, rollEvent(G));
    }
    checkStory(G);
    /* 手动模式下的战斗推进（自动模式已在 autoBattleTick 内处理） */
    if (G.battle && !G.battle.over && !G.auto.on) {
      G.battle.cd += dt * getTimeMultiplier(G);
      if (G.battle.cd >= 0.9) { G.battle.cd = 0; battleRound(G); }
    }
    if (G.storyQueue.length && !$("#modal-layer").classList.contains("on")) {
      const st = STORY.find(x => x.id === G.storyQueue[0]);
      if (st) showStoryModal(G, st);
    }
    /* 抵达阶段终点时提示（离线突破也可能触发） */
    if (isStageEnd(G) && !G.stageEndShown && !$("#modal-layer").classList.contains("on")) {
      showStageEnd(G);
    }
    saveAcc += dt;
    if (saveAcc > 5) { saveAcc = 0; save(); }
    /* 战斗中每帧刷新；自动模式也每帧刷新以呈现实时战况 */
    if (G.battle) render();
    else {
      G._uiAcc = (G._uiAcc || 0) + dt;
      if (G._uiAcc > 0.25) { G._uiAcc = 0; renderLight(); }
    }
  }
  requestAnimationFrame(loop);
}
/* ============================================================
   十、启动
   ============================================================ */
function startNewGame() {
  /* 取消开局选身世：新档不再有出身加成，随机测定灵根后直接开修 */
  const tot = ROOT_RAND.reduce((a, x) => a + x.w, 0);
  let r = Math.random() * tot, rootId = "wu";
  for (const x of ROOT_RAND) { r -= x.w; if (r <= 0) { rootId = x.id; break; } }
  const root = ROOTS.find(x => x.id === rootId);
  G = newState();          /* origin 为 null，无出身加成、无开局送功法 */
  G.root = rootId;
  const st = calcStats(G); G.hp = st.hpMax; G.mp = st.mpMax;
  G.tab = "cultivate";
  addLog(G, `你自青石镇出发，灵根为「${root.name}」。`, "g");
  checkStory(G);
  save(); render();
}
function boot() {
  const loaded = load();
  if (loaded) {
    G = loaded;
    G.tab = G.tab || "cultivate";
    /* 离线结算 */
    const off = offlineSettle(G);
    if (off) {
      addLog(G, `闭关 ${hhmmss(off.elapsed)}，修为 +${fmt(off.gain)}${off.breaks ? `，突破 ${off.breaks} 次` : ""}。`, "g");
      setTimeout(() => {
        const f = off.fight || { battles: 0, wins: 0, money: 0, items: 0 };
        showModal("🌙 闭关归来", `
          <p>你离开的这段时间，天地灵气未曾停歇。</p>
          <div class="hr"></div>
          <div class="kv"><span class="k">闭关时长</span><span class="v">${hhmmss(off.elapsed)}${off.elapsed > 24 * 3600 ? "（按 24 小时计）" : ""}</span></div>
          <div class="kv"><span class="k">获得修为</span><span class="v gold">+${fmt(off.gain)}</span></div>
          <div class="kv"><span class="k">自动突破</span><span class="v jade">${off.breaks} 次</span></div>
          ${f.battles ? `
          <div class="hr"></div>
          <div class="kv"><span class="k">自动历练场次</span><span class="v">${fmt(f.battles)} 场（胜 ${fmt(f.wins)}）</span></div>
          <div class="kv"><span class="k">历练所得灵石</span><span class="v gold">+${fmt(f.money)}</span></div>
          <div class="kv"><span class="k">自动变卖法宝</span><span class="v">${fmt(f.items)} 件</span></div>` : ""}
          <div class="hr"></div>
          <div class="kv"><span class="k">当前境界</span><span class="v">${realmInfo(off.after).name}</span></div>
        `, [{ t: "继续修行", pri: true, fn: closeModal }]);
      }, 300);
    }
    render();
  } else {
    startNewGame();
  }
  requestAnimationFrame(loop);
  window.addEventListener("beforeunload", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
  setInterval(() => { if (G && !G.battle) { } }, 1000);
}

/* =========================================================
   2D 美术层（不改动任何玩法逻辑，仅做展示增强）
   - 道侣 / 灵宠卡片加 2D 立绘
   - 历练页改为 2D 可探索大地图
   - 战斗加分区背景图 + 修士立绘 + 命中演出
   说明：全部通过渲染模板注入，不依赖 DOM 后处理，
         图片缺失时 onerror 自动隐藏，绝不影响玩法与存档。
   ========================================================= */
const ART = {
  lover: { shijie: "portrait-shijie.webp", danya: "portrait-danya.webp", huxian: "portrait-huxian.webp", monv: "portrait-monv.webp" },
  pet: { huo: "pet-huo.webp", xuan: "pet-xuan.webp", lei: "pet-lei.webp", jiu: "pet-jiu.webp", long: "pet-long.webp" },
  map: {
    qingshi: "map-qingshi.webp", hou: "map-hou.webp", lin: "map-lin.webp", zhao: "map-zhao.webp",
    huang: "map-huang.webp", yan: "map-yan.webp", bing: "map-bing.webp", jiu: "map-jiu.webp",
    mo: "map-mo.webp", jie: "map-jie.webp"
  }
};
/* 战斗舞台背景：当前历练地的氛围图 */
function battleBgHTML(s) {
  const z = ZONES.find(x => x.id === (s && s.zone)) || ZONES[0];
  const img = z && ART.map[z.id];
  if (!img) return "";
  return `<div class="battle-bg" style="background-image:url('assets/${img}')"></div>`;
}
/* 敌人立绘：以放大的 emoji 作为 2D 战斗精灵（每只妖兽形态各异） */
function foeSpriteHTML(foe) {
  const ic = (foe && foe.icon) ? foe.icon : "👹";
  const boss = foe && foe.isBoss;
  return `<span class="sprite-emoji${boss ? " boss" : ""}">${ic}</span>`;
}
/* 战斗命中演出：按回合给对应一方加动画 + 飘伤害字（纯装饰，失败静默） */
let _artLastRound = 0;
function artBattleFx() {
  try {
    if (!G || !G.battle) return;
    const b = G.battle;
    if (b.round === _artLastRound) return;
    _artLastRound = b.round;
    if (!document.querySelectorAll) return;          /* 测试桩 DOM：跳过 */
    const stage = document.querySelector("#main .battle-stage");
    if (!stage) return;
    const fighters = stage.querySelectorAll(".fighter") || [];
    const me = fighters[0], foe = fighters[1];
    const entry = b.log[b.log.length - 1] || {};
    const last = entry.txt || "", cls = entry.cls || "";
    const meActed = cls === "me" || (/你|灵宠/.test(last) && cls !== "foe");
    const foeActed = cls === "foe";
    if (meActed && foe) { foe.classList.add("hit"); setTimeout(() => foe.classList.remove("hit"), 340); }
    if (foeActed && me) { me.classList.add("hit"); setTimeout(() => me.classList.remove("hit"), 340); }
    if (meActed && me) { me.classList.add("act"); setTimeout(() => me.classList.remove("act"), 340); }
    const m = last.match(/造成\s*<b>([\d,]+)<\/b>\s*伤害/);
    if (m) {
      const target = foeActed ? me : foe;
      if (target && target.appendChild) {
        const d = document.createElement("div");
        d.className = "float-dmg" + (foeActed ? " foe" : "");
        d.textContent = "-" + m[1];
        target.appendChild(d);
        setTimeout(() => { try { d.remove(); } catch (e) { } }, 1000);
      }
    }
  } catch (e) { /* 演出失败不影响战斗 */ }
}
/* 把战斗演出钩进战斗日志（不改变原逻辑，仅在其后追加动画） */
const _artOrigAddBattleLog = addBattleLog;
addBattleLog = function (s, txt, cls) {
  _artOrigAddBattleLog(s, txt, cls);
  try { setTimeout(artBattleFx, 0); } catch (e) { }
};
boot();
</script>
